# Weekly update proposals for the Rust dependencies and the CI actions.
# Minor and patch Rust updates come as one PR; each major one comes alone, to be
# reviewed (API changes).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
