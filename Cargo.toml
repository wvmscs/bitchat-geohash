[package]
name = "bitchat-geohash"
version = "0.5.0"
edition = "2024"
description = "Live monitor of BitChat location channels (geohash): channel enumeration, the apps' relay choice, listening to kinds 20000/20001, and per-cell aggregation without personal data."
license = "GPL-3.0-or-later"
repository = "https://github.com/wvmscs/bitchat-geohash"

# Own workspace: the crate builds on its own, also inside another workspace.
[workspace]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["schnorr", "std"] }
# Relay lists, the apps' relay choice, geohash arithmetic: shared with
# bitchat-console (its decision D2), own repository.
geohash-relays = { git = "https://github.com/wvmscs/geohash-relays.git", tag = "strategies-2026.11.06" }
# Channels and `select!` only here: the runtime, timers and sockets are native
# (below); the browser build has its own.
tokio = { version = "1.54", features = ["sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
# Relay list downloads (24 h reload); the browser's `fetch` in wasm32.
reqwest = { version = "0.13", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.41", features = ["bundled"] }
# Natively, TLS without a bundled crypto provider: the ring one is installed
# process-wide, as for the WebSocket connections.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Web server of step 2 (feature `server`).
axum = { version = "0.8", optional = true, default-features = false, features = ["tokio", "http1", "json", "query"] }
# TLS for the server (lot 13 bis): HTTP/1.1 and HTTP/2 negotiated by ALPN.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", optional = true, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", optional = true, features = ["server-auto", "tokio", "service"] }
rustls-pki-types = { version = "1.9", optional = true, features = ["std"] }
# Logs of the binary.
tracing-subscriber = { version = "0.3", optional = true }
# Cells from a place, an address or an IP address, and the approximate name of
# a cell (feature `geocode`): BAN, Nominatim, DB-IP. Own repository.
geohash-lookup = { git = "https://github.com/wvmscs/geohash-lookup.git", tag = "v0.1.1", optional = true, default-features = false }

# Browser build (wasm32-unknown-unknown): randomness from the browser's crypto
# (pulled by k256's rand_core); timers, tasks and WebSockets of the browser.
# `wasm-bindgen` exactly as the `wasm-bindgen` command that builds the site.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["BinaryType", "CloseEvent", "Event", "MessageEvent", "WebSocket", "console"] }

[features]
default = ["server", "geocode"]
# The web server and the `bitchat-geohash` binary. Off: the library alone.
server = ["dep:axum", "dep:tokio-rustls", "dep:hyper", "dep:hyper-util", "dep:rustls-pki-types", "dep:tracing-subscriber", "tokio/signal"]
# The cell fields and the command line take a place or an IP address too
# (`#u09t`, `Paris`, `8.8.8.8`), and the page names the watched area.
geocode = ["dep:geohash-lookup"]

[[bin]]
name = "bitchat-geohash"
path = "src/main.rs"
required-features = ["server"]

[dev-dependencies]
tracing-subscriber = "0.3"
